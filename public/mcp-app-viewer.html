<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ACC Model Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        background: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #root { width: 100%; height: 600px; position: relative; }
      #frame { width: 100%; height: 100%; border: 0; display: none; background: #1a1a1a; }
      /* Diagnostic overlay — stays visible on top so we can read state even
         if the nested viewer iframe comes up blank. */
      #log {
        position: absolute;
        top: 0; left: 0; right: 0;
        max-height: 100%;
        overflow: auto;
        margin: 0;
        padding: 12px 14px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #d6f5d6;
        background: rgba(0, 0, 0, 0.72);
        white-space: pre-wrap;
        word-break: break-all;
        z-index: 10;
      }
      #log .err { color: #ff8f8f; }
      #log .ok { color: #8fd6ff; }
    </style>
  </head>
  <body>
    <div id="root">
      <pre id="log"></pre>
      <iframe id="frame" allow="fullscreen; xr-spatial-tracking"></iframe>
    </div>

    <script type="module">
      const logEl = document.getElementById('log');
      const frameEl = document.getElementById('frame');
      let n = 0;

      function log(msg, cls) {
        n += 1;
        const line = document.createElement('span');
        if (cls) line.className = cls;
        line.textContent = `${String(n).padStart(2, '0')}  ${msg}\n`;
        logEl.appendChild(line);
      }

      log('widget booting…');

      function openViewer(url) {
        log('viewerUrl received: ' + url.slice(0, 60) + '…', 'ok');
        log('setting nested iframe src → loading /viewer …');
        let loaded = false;
        frameEl.onload = () => { loaded = true; log('nested iframe fired onload ✓', 'ok'); };
        frameEl.onerror = () => log('nested iframe fired onerror ✗', 'err');
        frameEl.src = url;
        frameEl.style.display = 'block';
        // If nothing loads in 8s, the frame navigation was almost certainly
        // blocked (blank white with no console error == silently blocked).
        setTimeout(() => {
          if (!loaded) log('iframe has not loaded after 8s — navigation likely blocked by the host sandbox (frame-src).', 'err');
        }, 8000);
      }

      async function main() {
        log('importing ext-apps from esm.sh …');
        let App;
        try {
          ({ App } = await import('https://esm.sh/@modelcontextprotocol/ext-apps@1.7.4'));
        } catch (e) {
          log('FAILED to import ext-apps: ' + (e.message || e), 'err');
          throw e;
        }
        log('ext-apps imported ✓', 'ok');

        const app = new App({ name: 'ACC Model Viewer', version: '1.0.0' }, {});

        app.ontoolresult = (result) => {
          const keys = result ? Object.keys(result).join(', ') : '(null)';
          log('ontoolresult fired. result keys: [' + keys + ']');
          const url = result?.structuredContent?.viewerUrl ?? result?._meta?.viewerUrl;
          if (url) openViewer(String(url));
          else log('no viewerUrl in structuredContent or _meta — data channel problem.', 'err');
        };

        log('connecting to host (ui/initialize) …');
        await app.connect();
        log('connected to host ✓  platform=' + (app.getHostContext()?.platform ?? '?'), 'ok');
        log('waiting for ontoolresult …');
      }

      main().catch((err) => log('FATAL: ' + (err.message || String(err)), 'err'));
    </script>
  </body>
</html>
